<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1024, initial-scale=1, user-scalable=no">
  <title>Home weather agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="header">
    <h1 id="title">Home weather agent</h1>
    <div id="header-toggles">
      <label class="header-toggle" title="Current state, Battery status, Outside today, Last hours, Range">
        <span class="toggle-text">Audio</span>
        <span class="switch">
          <input type="checkbox" id="toggle-audio">
          <span class="slider"></span>
        </span>
      </label>
      <label class="header-toggle" title="Outside today, Last hours, Range">
        <span class="toggle-text">Graph</span>
        <span class="switch">
          <input type="checkbox" id="toggle-graph">
          <span class="slider"></span>
        </span>
      </label>
      <div id="answer-status" class="status-box idle">Ready</div>
    </div>
    <span id="status">Ready</span>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <section class="panel">
        <h2>Reports</h2>
        <button id="btn-current" class="req-btn">Current state</button>
        <button id="btn-battery" class="req-btn">Battery status</button>
      </section>

      <section class="panel">
        <h2>Extended reports</h2>
        <button id="btn-outside-today" class="req-btn">Outside today</button>
        <div class="field-row">
          <label>Data:</label>
          <div class="segmented" id="datasource-select">
            <button type="button" class="seg-btn active" data-source="weather">Weather</button>
            <button type="button" class="seg-btn" data-source="power">Power</button>
          </div>
        </div>
        <div class="row">
          <button id="btn-last-hours" class="req-btn grow">Last hours</button>
          <select id="hours-select" class="hours-select"></select>
        </div>
        <button id="btn-range" class="req-btn full">Run range query</button>
        <div class="field-row">
          <label for="from-date">From:</label>
          <input type="date" id="from-date">
        </div>
        <div class="field-row">
          <label for="to-date">To:</label>
          <input type="date" id="to-date">
        </div>
      </section>

      <section class="panel" id="metric-panel" hidden>
        <h2>Metric</h2>
        <select id="metric-select"></select>
      </section>
    </aside>

    <main id="content">
      <div id="graph-area" hidden>
        <img id="graph-image" alt="">
        <div id="equalizer" hidden>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div id="answer-strip"></div>
    </main>
  </div>

  <audio id="audio-player" hidden></audio>
  <script src="app.js"></script>
</body>
</html>
